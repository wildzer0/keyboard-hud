[package]
name = "keyboard-hud"
version = "1.5.0"
edition = "2021"
license = "GPL-2.0-or-later"
description = "Portable on-screen HUD for QMK keyboards with Vial"
build = "build.rs"

[dependencies]
eframe = { version = "0.37", default-features = false, features = ["glow", "default_fonts", "x11", "wayland"] }
egui = { version = "0.37", default-features = false }
# Pure Rust backends on Linux (hidraw, no libudev) and Windows; the C backend on macOS.
hidapi = { version = "2.6", default-features = false, features = ["linux-native-basic-udev", "windows-native"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
# edits to keyboard-hud.toml that keep the user's comments (config_edit.rs)
toml_edit = "0.25"
lzma-rs = "0.3"
directories = "6"
log = "0.4"
sysinfo = { version = "0.39", default-features = false, features = ["system"] }
# tray icon; on Linux through D-Bus (StatusNotifierItem), without GTK (tray.rs)
tray-icon = { version = "0.26", default-features = false, features = ["ksni"] }
# checksums of the downloaded updates (update.rs); downloads go through the system curl
sha2 = { version = "0.10", default-features = false }

[target.'cfg(windows)'.dependencies]
# cursor and monitor geometry (ui::cursor_on_screen, screen.rs), autostart registry entry (autostart.rs),
# windows without the system shadow (ui/frameless.rs)
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Globalization", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi", "Win32_System_Registry", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(target_os = "linux")'.dependencies]
# foreground application on X11, for per-application labels (foreground.rs)
x11rb = "0.13"

[target.'cfg(target_os = "macos")'.dependencies]
# foreground application, for per-application labels (foreground.rs)
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "libc", "NSRunningApplication", "NSWorkspace"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString"] }

[build-dependencies]
# icon and version information of the Windows executable (build.rs)
winresource = { version = "0.1", default-features = false }
deser-hjson = "2.2"
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
